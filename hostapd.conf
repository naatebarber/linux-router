# Control interface
ctrl_interface=/var/run/hostapd
ctrl_interface_group=wheel

# MAC address and SSID settings
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
ssid=shellnet

country_code=US
# Modern wireless driver
driver=nl80211
interface=wlp1s0

# Wi-Fi mode (Set to 5GHz and Wi-Fi 6)
hw_mode=a
channel=36
ieee80211d=1       # Enable 802.11d (regulatory domain)
ieee80211h=1       # Enable 802.11h (DFS and TPC)
ieee80211n=1       # Enable 802.11n (Wi-Fi 4)
ieee80211ac=1      # Enable 802.11ac (Wi-Fi 5)
ieee80211ax=1      # Enable 802.11ax (Wi-Fi 6)

# Channel width
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]  # 802.11n capabilities
vht_capab=[SHORT-GI-80][TX-STBC-2BY1]       # 802.11ac capabilities
vht_oper_chwidth=1                          # 80 MHz channel width
vht_oper_centr_freq_seg0_idx=42             # Center frequency for 80 MHz

# WPA settings
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=charlotte

# QoS and performance improvements
wmm_enabled=1       # Enable Wi-Fi Multimedia (WMM)
ieee80211w=2        # Protected Management Frames (required for Wi-Fi 6)

